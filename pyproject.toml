[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hiver-ai-support-agent"
version = "1.0.0"
description = "Production-grade AI Support & Triage Agent for @AppleSupport (Hiver SDE Intern)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.22",
    "scikit-learn>=1.3.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "rouge-score>=0.1.2",
    "numpy>=1.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
