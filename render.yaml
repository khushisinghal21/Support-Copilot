# Render Blueprint for this app. On Render: New + -> Blueprint -> connect
# this GitHub repo -> Render reads this file and creates the service below.
# You'll be prompted once for GEMINI_API_KEY (kept as a Render secret, never
# committed here). Everything else is preconfigured.
services:
  - type: web
    name: hiver-ai-support-agent
    runtime: python
    plan: free
    # A first attempt ran `pip install torch --index-url .../cpu` as its own
    # command before `pip install -r requirements.txt`. That didn't stick --
    # the SECOND command is a separate pip invocation with no knowledge of
    # the CPU index, and its resolver pulled the full CUDA-bundled `torch`
    # (plus a dozen nvidia-* packages) straight back in from the default
    # PyPI index to satisfy transformers/sentence-transformers' version
    # constraints, silently overwriting the CPU-only install. The fix is to
    # resolve everything in ONE pip call, with the CPU index as the PRIMARY
    # index (so "torch" only ever resolves there) and PyPI as a fallback
    # for every other package via --extra-index-url.
    buildCommand: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-3.6-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: ENABLE_LIVE_LINK_CHECK
        value: "true"
