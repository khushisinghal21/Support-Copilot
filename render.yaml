# Render Blueprint for this app. On Render: New + -> Blueprint -> connect
# this GitHub repo -> Render reads this file and creates the service below.
# You'll be prompted once for GEMINI_API_KEY (kept as a Render secret, never
# committed here). Everything else is preconfigured.
services:
  - type: web
    name: hiver-ai-support-agent
    runtime: python
    plan: free
    # Installing torch CPU-only *before* requirements.txt matters: plain
    # `pip install torch` on Linux pulls the default CUDA-bundled wheel plus
    # a long tail of nvidia-* packages (cuda-toolkit, nvidia-cudnn,
    # nvidia-cublas, etc.) even though Render's instances have no GPU. That
    # bloats the build and, worse, the extra CUDA shared libraries get
    # mapped into the process at runtime -- a real contributor to this
    # service exceeding its 512MB memory limit. The CPU-only wheel from
    # PyTorch's own index skips all of that; sentence-transformers (which
    # requirements.txt installs next) is satisfied by whichever torch is
    # already present, so it won't overwrite this with the CUDA build.
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-3.6-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: ENABLE_LIVE_LINK_CHECK
        value: "true"
